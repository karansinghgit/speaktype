name: Feature request
description: Suggest something SpeakType should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation rather than the solution, so there's room to find the best one.
      placeholder: When I dictate into Slack, I...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like SpeakType to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
