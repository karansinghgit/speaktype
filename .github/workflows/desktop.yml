name: SpeakType 2

# Checks, tests and builds the cross-platform app in desktop/ on macOS, Windows
# and Linux. Pushing a tag like v2.0.0-alpha.5 also publishes a GitHub
# pre-release with installers for all three. SpeakType 1 keeps using ci.yml.

on:
  # Feature branches are covered by their pull request, so pushes only run on
  # main and release tags. That avoids building every commit twice.
  push:
    branches: [main]
    tags: ["v2.*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail CI; they don't fail local builds.
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: desktop

jobs:
  frontend:
    name: Frontend (types, tests, build)
    # A release tag points at a commit these checks already passed on, so tags
    # skip straight to the installers.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    name: Rust (${{ matrix.name }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-desktop-build
      - name: Format
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets
      - name: Tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: desktop/src-tauri
        run: cargo audit

  bundle:
    name: Installer (${{ matrix.name }})
    needs: [frontend, rust]
    # Also runs when the checks were skipped for a tag, but not when they failed.
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            artifact: speaktype-macos-arm64
          - name: Windows
            os: windows-2025
            artifact: speaktype-windows-x64
          - name: Linux
            os: ubuntu-24.04
            artifact: speaktype-linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-desktop-build
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only warnings in our own code should fail the lint job, not the installer build.
          RUSTFLAGS: ""
        with:
          projectPath: desktop
          tauriScript: npx tauri
          # On a v2 tag, publish a pre-release so SpeakType 1 stays the "Latest" release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v2.') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v2.') && format('SpeakType {0}', github.ref_name) || '' }}
          releaseBody: |
            An early build of SpeakType 2 for macOS, Windows and Linux. Expect rough edges.
            SpeakType 1 remains the stable release. See desktop/ROADMAP.md for what's left.

            These builds aren't signed by Apple or Microsoft yet, so the first launch needs one extra step:
            - macOS: if it says Apple couldn't check the app, open System Settings → Privacy & Security and click Open Anyway.
            - Windows: on the SmartScreen prompt, click More info, then Run anyway.
          releaseDraft: false
          prerelease: true
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
